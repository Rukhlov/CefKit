name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # CEF run-time libraries, a virtual display for the smoke check, and the NativeAOT toolchain
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Cache CEF downloads
        uses: actions/cache@v4
        with:
          path: artifacts/cef/downloads
          key: cef-${{ runner.os }}-${{ hashFiles('cef-version.json') }}

      - name: Fetch CEF
        shell: pwsh
        run: ./eng/fetch-cef.ps1

      - name: Publish helper
        shell: pwsh
        run: ./eng/publish-helper.ps1

      - name: Build
        run: dotnet build CefKit.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/CefKit.Tests -c Release --no-build

      # The result goes to annotations, readable without signing in
      - name: Smoke check (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash eng/ci-smoke.sh artifacts/bin/CefKit.Smoke/release

      - name: Smoke check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash eng/ci-smoke.sh artifacts/bin/CefKit.Smoke/release xvfb-run -a
